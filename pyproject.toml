[project]
name = "reel-watcher"
version = "0.1.0"
description = "Have a local AI model watch the Instagram reels you saved and write structured notes. Windows edition (Ollama + faster-whisper + RapidOCR), free: yt-dlp download, analysis is local."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jacob Bruce" }]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=1.26",
    "pillow>=12.3.0",  # older releases have known security advisories (pip-audit)
    "rapidocr-onnxruntime>=1.3.24; python_version < '3.13'",
    "segno>=1.6",
    "yt-dlp>=2026.7.4",  # older releases have known security advisories (pip-audit)
]

[project.scripts]
reel-watcher = "reel_watcher.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.48",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
