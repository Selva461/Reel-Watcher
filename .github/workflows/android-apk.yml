name: Android APK

on:
  push:
    paths:
      - "android/app-shell/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK (free GitHub runner, Android SDK preinstalled)
        run: gradle -p android/app-shell assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ReelShelf-apk
          path: android/app-shell/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish to the "apk-latest" release (direct download link for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app-shell/app/build/outputs/apk/debug/app-debug.apk ReelShelf.apk
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest --prerelease --target "$GITHUB_SHA" --title "Reel Shelf for Android (latest build)" \
              --notes "Download ReelShelf.apk on your Android phone and open it to install. Built automatically from branch $GITHUB_REF_NAME."
          fi
          gh release upload apk-latest ReelShelf.apk --clobber
