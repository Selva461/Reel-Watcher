name: Android APK

on:
  push:
    paths:
      - "android/app-shell/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # publishing the apk-latest release
    steps:
      # actions pinned to exact commits (tag in the comment); Dependabot proposes updates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
        with:
          gradle-version: "8.9"
      - name: Build the APK (release, not debuggable; free GitHub runner, Android SDK preinstalled)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export RS_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          gradle -p android/app-shell assembleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"
          cp android/app-shell/app/build/outputs/apk/release/app-release.apk ReelShelf.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ReelShelf-apk
          path: ReelShelf.apk
      - name: Publish to the "apk-latest" release (direct download link for your phone)
        # only builds of the branch phones install from are published; other branches (Dependabot, pull requests)
        # are built and tested but can never replace the APK people download
        if: github.ref == 'refs/heads/ccr-d0c0b070-bdpssy' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest --prerelease --target "$GITHUB_SHA" --title "Reel Shelf for Android (latest build)" \
              --notes "Download ReelShelf.apk on your Android phone and open it to install. Built automatically from branch $GITHUB_REF_NAME."
          fi
          gh release upload apk-latest ReelShelf.apk --clobber
          gh release edit apk-latest --target "$GITHUB_SHA" \
            --notes "Download ReelShelf.apk on your Android phone and open it to install. Built from commit $GITHUB_SHA (branch $GITHUB_REF_NAME)."
