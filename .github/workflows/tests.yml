name: Tests

on:
  # A pull request commit is already tested by pull_request below; running on push as well started the same
  # ~5.5 minute run twice for every commit. Push only tests the default branch, after each merge.
  push:
    branches: [ccr-d0c0b070-bdpssy]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly: catches newly published advisories in unchanged dependencies

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions pinned to exact commits (tag in the comment); Dependabot proposes updates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      # A runner network fault used to hang this step until the 30 minute job limit (seen twice in one hour on PR
      # #71 and #72, before any test ran). Each apt command now has its own time limit and the whole step is
      # retried; the step as a whole is capped at 10 minutes so a bad runner fails fast and can be re-run.
      - name: Install ffmpeg (bounded, retried)
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update \
              && timeout 200 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            sleep 10
          done
          exit 1
      - run: uv sync --locked
      - run: uv run pytest -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Known vulnerabilities in every locked dependency (pip-audit)
        run: |
          uv export --locked --all-groups --no-hashes --no-emit-project > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip --strict --progress-spinner off
