plugins {
    id 'com.android.application'
}

android {
    namespace 'app.reelshelf'
    compileSdk 36

    defaultConfig {
        applicationId 'app.reelshelf'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '1.3.2'  // raise both on every change (versionCode +1); CHANGELOG.md gets a matching section
        ndk { abiFilters 'arm64-v8a' }  // phones only (keeps the APK small: speech, text and AI libraries are native)
    }
    // Release builds are not debuggable. They are signed with your own key when the GitHub secrets
    // ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD are set
    // (then each new APK installs over the old one); otherwise with a throwaway key made on the build machine.
    signingConfigs {
        own {
            def ks = System.getenv("RS_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("RS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RS_KEY_ALIAS") ?: "reelshelf"
                keyPassword System.getenv("RS_KEY_PASSWORD") ?: System.getenv("RS_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig System.getenv("RS_KEYSTORE") ? signingConfigs.own : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    // The AI model that runs on the phone (Google LiteRT-LM, free, Apache 2.0). Called from Java.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.0'
    // tests of the online check run on the build computer (org.json is only a stub there without this)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    // Reads the text in screenshots on the phone (Google ML Kit text recognition v2, Latin script). The model is
    // bundled inside the APK: free, works offline, nothing is uploaded, no Google Play services needed.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Offline speech to text (Vosk, Apache 2.0): the spoken words of a reel, on the phone. Its model (about 40 MB)
    // is downloaded only when you ask for it in Settings.
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
}
